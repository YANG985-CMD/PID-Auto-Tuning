name: Mock and MCU host checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Config and causal experience checker
        run: python -B skills/motor-td3-serial-tuning/scripts/session_checks.py self-test
      - name: CAN capture refuses active mode and unavailable channels
        run: python -B scripts/test_can_monitor.py
      - name: CAN SRAM loopback contract and failure cleanup without hardware
        run: python -B scripts/test_can_loopback.py --output "${{ runner.temp }}/td3-can-loopback"
      - name: CAN active echo requires ready guest and bounded diagnostic frames
        run: python -B scripts/test_can_echo.py --output "${{ runner.temp }}/td3-can-echo"
      - name: Bridge faults and serial byte stream
        run: python -B skills/motor-td3-serial-tuning/scripts/test_runtime.py --output "${{ runner.temp }}/td3-runtime"
      - name: CAN binary protocol and actual applied feedback over compiled C peer
        run: python -B skills/motor-td3-serial-tuning/scripts/test_can_runtime.py --output "${{ runner.temp }}/td3-can-runtime" --compiler gcc
      - name: G431 locked adapter filters, disable paths and missing sensor rejection
        run: python -B skills/motor-td3-serial-tuning/scripts/test_g431_integration.py --output "${{ runner.temp }}/td3-g431-adapter" --compiler gcc
      - name: SpeedLoop diagnostic state mapping and rejected motion commands
        run: python -B skills/motor-td3-serial-tuning/scripts/test_g431_integration.py --speedloop --output "${{ runner.temp }}/td3-speedloop-adapter" --compiler gcc
      - name: Diagnostic software ADC sampling rejects incomplete and invalid conversions
        run: python -B skills/motor-td3-serial-tuning/scripts/test_speedloop_sample.py --output "${{ runner.temp }}/td3-speedloop-sampler" --compiler gcc
      - name: SpeedLoop HELLO-only capture rejects identity, stale ADC and enabled outputs
        run: python -B skills/motor-td3-serial-tuning/scripts/test_speedloop_can_capture.py
      - name: Watchdog feed supervisor and SRAM reset evidence without hardware
        run: python -B skills/motor-td3-serial-tuning/scripts/test_g431_watchdog.py --output "${{ runner.temp }}/td3-watchdog" --compiler gcc
      - name: COMP Break diagnostic rejects unsafe traces and always cleans up
        run: python -B skills/motor-td3-serial-tuning/scripts/test_g431_comp_break.py --output "${{ runner.temp }}/td3-g431-comp-break"
      - name: Offline current calibration fit keeps hardware approval closed
        run: python -B skills/motor-td3-serial-tuning/scripts/test_fit_current_calibration.py
      - name: MCU C protocol and guard
        run: python -B skills/motor-td3-serial-tuning/scripts/test_firmware.py --output "${{ runner.temp }}/td3-firmware" --compiler gcc
      - name: RAM PIL refuses unsafe or mismatched requests without hardware
        run: python -B skills/motor-td3-serial-tuning/scripts/test_pil_contract.py --output "${{ runner.temp }}/td3-pil-contract"
      - name: Published mock Actor MATLAB reference parity
        run: python -B skills/motor-td3-serial-tuning/scripts/actor_codegen.py --model examples/mock-validation/actor.json --output "${{ runner.temp }}/td3-actor" --reference examples/mock-validation/matlab-reference.json --compiler gcc
